services:
  web:
    build:
      context: .
      target: prod
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL to the campus HTTPS origin}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
